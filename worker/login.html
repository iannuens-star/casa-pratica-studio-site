<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0F766E">
<title>Entrar — Painel Casa Prática</title>
<link rel="manifest" href="/painel/manifest.webmanifest">
<link rel="apple-touch-icon" href="/painel/icone.svg">
<style>
  :root { --bg:#F7F5F0; --card:#fff; --ink:#1F2933; --muted:#5B6670; --brand:#0F766E; --err:#B42318; --line:#E3DED3; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14181B; --card:#1D2327; --ink:#EEF1F2; --muted:#A3ADB3; --brand:#2DB3A3; --err:#F97066; --line:#2C3439; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
         font:17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding:16px; }
  form { width:100%; max-width:380px; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:24px; }
  h1 { font-size:22px; margin:0 0 4px; }
  p { color:var(--muted); margin:0 0 20px; font-size:15px; }
  label { display:block; font-weight:600; margin-bottom:6px; }
  input { width:100%; font-size:17px; padding:14px; border-radius:12px; border:1px solid var(--line); background:var(--bg); color:var(--ink); }
  button { width:100%; margin-top:16px; min-height:50px; font-size:17px; font-weight:600; border:0; border-radius:12px;
           background:var(--brand); color:#fff; }
  button:disabled { opacity:.6; }
  .err { color:var(--err); min-height:22px; margin-top:12px; font-size:15px; }
</style>
</head>
<body>
<form id="f">
  <h1>Painel Casa Prática</h1>
  <p>Área restrita. Entre com a senha do painel.</p>
  <label for="s">Senha</label>
  <input id="s" type="password" autocomplete="current-password" required>
  <button id="b" type="submit">Entrar</button>
  <div class="err" id="e" role="alert"></div>
</form>
<script>
  const f = document.getElementById("f"), b = document.getElementById("b"), e = document.getElementById("e");
  f.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    b.disabled = true; e.textContent = "";
    try {
      const r = await fetch("/painel/api/login", { method: "POST", credentials: "same-origin",
        headers: { "Content-Type": "application/json", "X-Painel": "1" },
        body: JSON.stringify({ senha: document.getElementById("s").value }) });
      const d = await r.json().catch(() => ({}));
      if (r.ok) { location.replace("/painel"); return; }
      e.textContent = d.erro || "Não foi possível entrar.";
    } catch (_) {
      e.textContent = "Sem conexão. Confira a internet e tente de novo.";
    }
    b.disabled = false;
  });
</script>
</body>
</html>
